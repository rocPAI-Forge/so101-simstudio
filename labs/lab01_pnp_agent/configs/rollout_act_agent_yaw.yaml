# =============================================================================
# Lab 01 — agent-yaw ACT eval
# =============================================================================
# Matches the yaw collector, not the teleop rollout_act.yaml:
#   ee.pos is gripperframe (fingertip), home gripper is open (0.85),
#   reset_arm is home. Do not use rollout_act.yaml for this checkpoint:
#   that file defaults to wrist_site and home_gripper -0.1.
#
#   LAB01_POLICY_PATH=./outputs/train/lab01_pnp_act_agent_yaw_v2/checkpoints/040000/pretrained_model \
#   LAB01_EVAL_CONFIG=labs/lab01_pnp_agent/configs/rollout_act_agent_yaw.yaml \
#   LAB01_DATASET_REPO_ID=alexhegit/so101-simstudio-lab01-pnp-agent-yaw-v2 \
#   LAB01_DATASET_ROOT=./datasets/so101-simstudio-lab01-pnp-agent-yaw-v2 \
#   LAB01_N_ACTION_STEPS=50 LAB01_EVAL_EPISODES=20 \
#   LAB01_MUJOCO_GL=egl LAB01_RENDER_WINDOW=false \
#     ./labs/lab01_pnp/eval.cmd
# =============================================================================

robot:
  type: so101_mujoco
  action_mode: position
  ee_site_name: gripperframe
  home_gripper: 0.85
  reset_mode: auto
  reset_arm: home
  reset_cube: random
  cube_random_x_range: [0.26, 0.34]
  cube_random_y_range: [0.165, 0.235]
  cube_random_z: 0.0125
  cube_random_yaw_range: [-45.0, 45.0]
  xml_path: SO101/scenes/simple_pick/scene.xml
  cube_positions_path: configs/scenes/simple_pick/cube_positions.json
  record_fps: 20
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: false

fps: 20
task: "Pick up the cube and place it in the box."

strategy:
  type: base

inference:
  type: sync

play_sounds: false
display_data: false
display_mode: rerun
return_to_initial_position: false

eval:
  num_episodes: 20
  episode_time_s: 60
  reset_time_s: 3
  stats_dataset_repo_id: alexhegit/so101-simstudio-lab01-pnp-agent-yaw-v2
  stats_dataset_root: ./datasets/so101-simstudio-lab01-pnp-agent-yaw-v2
