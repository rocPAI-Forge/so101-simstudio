# Lab 01 LingBot-VA fair EEF rollout.
# Run with LAB01_LINGBOT_EEF_ADAPTER=true so 7-D LIBERO controller commands
# are projected to safe 6-D absolute SO-101 joints before robot.send_action.

robot:
  type: so101_mujoco
  action_mode: position
  home_gripper: 0.85
  reset_mode: auto
  reset_arm: home
  reset_cube: random
  cube_random_x_range: [0.26, 0.34]
  cube_random_y_range: [0.165, 0.235]
  cube_random_z: 0.0125
  cube_random_yaw_range: [-45.0, 45.0]
  xml_path: SO101/scenes/simple_pick/scene.xml
  cube_positions_path: configs/scenes/simple_pick/cube_positions.json
  record_fps: 20
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true

fps: 20
task: "Pick up the cube and place it in the box."

rename_map:
  observation.images.camera_front: observation.images.image
  observation.images.camera_wrist: observation.images.image2

strategy:
  type: base

inference:
  type: sync

play_sounds: false
display_data: false
display_mode: rerun
return_to_initial_position: false

eval:
  num_episodes: 20
  episode_time_s: 60
  reset_time_s: 3
  stats_dataset_repo_id: alexhegit/so101-simstudio-lab01-pnp-agent193-lingbot-eef
  stats_dataset_root: ./.tmp/lab01_lingbot_eef_agent193
