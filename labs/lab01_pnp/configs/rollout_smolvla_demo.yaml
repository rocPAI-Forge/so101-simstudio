# =============================================================================
# Lab 01 — SmolVLA demo eval (narrowed random spawn; default for eval.cmd)
# =============================================================================
# Teaching-friendly box (not an honest full-range benchmark):
#   x[0.265,0.29] y[0.175,0.205] yaw[-15,0]
# reset_arm: home (contrast with ACT eval YAMLs = follow). See lab01_pnp.md §6.2.
# Full-range: labs/lab01_pnp/configs/rollout_smolvla.yaml
# =============================================================================

robot:
  type: so101_mujoco
  action_mode: position
  home_gripper: -0.1
  reset_mode: auto
  reset_arm: home
  reset_cube: random
  cube_random_x_range: [0.265, 0.29]
  cube_random_y_range: [0.175, 0.205]
  cube_random_z: 0.0125
  cube_random_yaw_range: [-15.0, 0.0]
  xml_path: SO101/scenes/simple_pick/scene.xml
  cube_positions_path: configs/scenes/simple_pick/cube_positions.json
  record_fps: 20
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true

fps: 20
task: "Pick up the cube and place it in the box."

rename_map:
  observation.images.camera_top: observation.images.camera1
  observation.images.camera_front: observation.images.camera2
  observation.images.camera_wrist: observation.images.camera3

strategy:
  type: base

inference:
  type: rtc

play_sounds: false
display_data: false
display_mode: rerun
return_to_initial_position: false

eval:
  num_episodes: 10
  episode_time_s: 60
  reset_time_s: 3
  stats_dataset_repo_id: alexhegit/so101-simstudio-lab01-pnp
  stats_dataset_root: ./datasets/so101-simstudio-lab01-pnp
