# =============================================================================
# Lab 01 — FastWAM eval from leader-demo mean start joints
# =============================================================================
# Same cameras as rollout_fastwam.yaml. Arm home matches the 50-episode parquet
# start mean (reset_arm: follow at record). Use after a keyboard-home eval where
# the cube never leaves spawn.
#
#   LAB01_POLICY_PATH=./outputs/train/lab01_pnp_fastwam/checkpoints/020000/pretrained_model \
#   LAB01_EVAL_CONFIG=labs/lab01_pnp/configs/rollout_fastwam_demo_start.yaml \
#   LAB01_N_ACTION_STEPS=10 LAB01_EVAL_EPISODES=10 \
#     ./labs/lab01_pnp/eval.cmd
# =============================================================================

robot:
  type: so101_mujoco
  action_mode: position
  home_gripper: -0.1
  home_joints: [-0.180, -1.642, 1.577, 1.081, 0.079, -0.045]
  reset_mode: auto
  reset_arm: home
  reset_cube: random
  cube_random_x_range: [0.26, 0.34]
  cube_random_y_range: [0.165, 0.235]
  cube_random_z: 0.0125
  cube_random_yaw_range: [-45.0, 45.0]
  xml_path: SO101/scenes/simple_pick/scene.xml
  cube_positions_path: configs/scenes/simple_pick/cube_positions.json
  record_fps: 20
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true

fps: 20
task: "Pick up the cube and place it in the box."

rename_map:
  observation.images.camera_top: observation.images.image
  observation.images.camera_wrist: observation.images.image2

strategy:
  type: base

inference:
  type: sync

play_sounds: false
display_data: false
display_mode: rerun
return_to_initial_position: false

eval:
  num_episodes: 10
  episode_time_s: 60
  reset_time_s: 3
  stats_dataset_repo_id: alexhegit/so101-simstudio-lab01-pnp
  stats_dataset_root: ./datasets/so101-simstudio-lab01-pnp
