# Generic external VLA closed-loop evaluation.
#
# Create a policy bundle first:
#   python -m simstudio.scripts.create_external_vla_bundle \
#     --manifest configs/external_vla/fake_manifest.json \
#     --output outputs/external_vla/fake --backend sidecar
#
# Start the matching sidecar in its native environment, then:
#   LAB01_POLICY_PATH=outputs/external_vla/fake \
#   LAB01_EVAL_CONFIG=labs/lab01_pnp/configs/rollout_external_vla.yaml \
#     ./labs/lab01_pnp/eval.cmd

robot:
  type: so101_mujoco
  action_mode: position
  home_gripper: -0.1
  reset_mode: auto
  reset_arm: home
  reset_cube: fixed
  xml_path: SO101/scenes/simple_pick/scene.xml
  cube_positions_path: configs/scenes/simple_pick/cube_positions.json
  record_fps: 20
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true

fps: 20
task: "Pick up the cube and place it in the box."

strategy:
  type: base

inference:
  type: rtc
  rtc:
    enabled: true
    execution_horizon: 10
  queue_threshold: 0

play_sounds: false
display_data: false
display_mode: rerun
return_to_initial_position: false

eval:
  num_episodes: 10
  episode_time_s: 60
  reset_time_s: 3
  stats_dataset_repo_id: alexhegit/so101-simstudio-lab01-pnp
  stats_dataset_root: ./datasets/so101-simstudio-lab01-pnp
  state_dim: 6
