# =============================================================================
# Lab 01 — ACT fixed-pose demo eval
# =============================================================================
# Same pose as rollout_smolvla_demo_fixed.yaml; ACT-compatible (no rename_map).
# reset_arm: follow (intentional contrast with SmolVLA demo_fixed = home).
#   See labs/lab01_pnp/lab01_pnp.md §1 / §6.2.
#
#   LAB01_POLICY_PATH=./outputs/train/lab01_pnp_act/checkpoints/last/pretrained_model \
#   LAB01_EVAL_CONFIG=labs/lab01_pnp/configs/rollout_act_demo_fixed.yaml \
#   LAB01_MUJOCO_GL=glfw LAB01_RENDER_WINDOW=true \
#   LAB01_EVAL_EPISODES=10 LAB01_N_ACTION_STEPS=100 \
#     ./labs/lab01_pnp/eval.cmd
# =============================================================================

robot:
  type: so101_mujoco
  action_mode: position
  home_gripper: -0.1
  reset_mode: auto
  reset_arm: follow
  reset_cube: fixed
  xml_path: SO101/scenes/simple_pick/scene.xml
  cube_positions_path: labs/lab01_pnp/configs/cube_positions_demo_fixed.json
  record_fps: 20
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true

fps: 20
task: "Pick up the cube and place it in the box."

strategy:
  type: base

inference:
  type: sync

play_sounds: false
display_data: false
display_mode: rerun
return_to_initial_position: false

eval:
  num_episodes: 10
  episode_time_s: 60
  reset_time_s: 3
  stats_dataset_repo_id: alexhegit/so101-simstudio-lab01-pnp
  stats_dataset_root: ./datasets/so101-simstudio-lab01-pnp
