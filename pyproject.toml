[project]
name = "so101-simstudio"
version = "0.1.1"
description = "SO-101 simulation studio: expert trajectory generation with MuJoCo and LeRobot"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.0.0,<4.0.0",
    "scipy>=1.10.0",
    "lerobot[kinematics,dataset,viz,deepdiff-dep]",
    "matplotlib>=3.10.6",
    "pynput>=1.7.7",
    "evdev>=1.6.0",
]

[tool.uv.sources]
lerobot = { path = "lerobot", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]
smolvla = [
    "lerobot[smolvla]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "simstudio*",
    "lerobot_robot_so101_mujoco*",
    "lerobot_teleoperator_so101_keyboard*",
]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["lerobot"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
