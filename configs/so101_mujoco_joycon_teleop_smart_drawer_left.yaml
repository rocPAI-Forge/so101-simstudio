# Joy-Con (LEFT) teleop on smart_drawer — same frozen scheme as the right reference.
# Launch: ./scripts/demo/drawer_teleop.cmd joycon left
# Right twin: configs/so101_mujoco_joycon_teleop_smart_drawer.yaml
#
# Stick/IK identical to right. Wrist uses the d-pad (no A/B/X/Y on left):
#   Up/Down = wrist_flex ±, Left/Right = wrist_roll ±.

robot:
  type: so101_mujoco
  action_mode: velocity
  horizontal_control_mode: cylindrical
  ik_joint_weights: [1.15, 0.90, 0.55]
  xml_path: SO101/scenes/smart_drawer/scene.xml
  cube_positions_path: configs/scenes/smart_drawer/cube_positions.json
  record_fps: 30
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true
  lin_speed: 0.04
  yaw_speed: 1.20
  grip_speed: 0.7
  ori_gain: 6.0
  tilt_deadzone: 0.03
  tilt_wmax: 6.0
  lambda_pos: 0.008
  lambda_tilt: 0.0001
  vel_limit: 0.5
  vel_limit_wrist: 8.0
  smooth_dq: 0.30
  smooth_dq_wrist: 0.08
  wrist_gff_gain: 0.5
  table_z: 0.0
  clearance: 0.07
  ee_site_name: wrist_site
  tool_axis_site: [0.0, -1.0, 0.0]

teleop:
  type: so101_joycon
  side: left
  device: auto
  translation_scale: 1.5
  z_scale: 1.0
  stick_axis_map: reach_swing
  invert_x: false
  invert_y: true
  wrist_control: buttons
  wrist_flex_pos_button: up
  wrist_flex_neg_button: down
  wrist_roll_pos_button: left
  wrist_roll_neg_button: right
  wrist_button_rate: 2.0
  gripper_toggle: true                 # press ZL to latch close/open
  enable_button_recording: false
