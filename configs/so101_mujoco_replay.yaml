# Replay recorded episode on MuJoCo simulation

robot:
  type: so101_mujoco
  xml_path: SO101/pick_scene.xml
  cube_positions_path: configs/cube_positions.json
  record_fps: 30
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true

dataset:
  repo_id: alexhegit/so101_mujoco_keyboard_test
  root: ./datasets/keyboard-test
  episode: 0

play_sounds: false
