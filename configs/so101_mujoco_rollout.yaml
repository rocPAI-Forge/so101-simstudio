# =============================================================================
# SO-101 SimStudio — SmolVLA sim2sim policy rollout / eval
# =============================================================================
# Closed-loop inference in MuJoCo (position control, 20 Hz, three cameras).
#
# Usage:
#   # Multi-episode eval with success rate (recommended):
#   python -m simstudio.scripts.eval --config configs/so101_mujoco_rollout.yaml \
#     --policy.path=./outputs/train/lab01_pnp_smolvla_bs4/checkpoints/007500/pretrained_model
#
#   # Single continuous rollout (lerobot-rollout base strategy):
#   python -m simstudio.scripts.rollout --config configs/so101_mujoco_rollout.yaml \
#     --strategy.type=base \
#     --policy.path=./outputs/train/.../pretrained_model \
#     --duration=60
# =============================================================================

robot:
  type: so101_mujoco
  action_mode: position
  home_gripper: -0.1
  reset_mode: auto
  reset_arm: home
  reset_cube: random
  cube_random_x_range: [0.26, 0.34]
  cube_random_y_range: [0.165, 0.235]
  cube_random_z: 0.0125
  cube_random_yaw_range: [-45.0, 45.0]
  xml_path: SO101/scenes/simple_pick/scene.xml
  cube_positions_path: configs/scenes/simple_pick/cube_positions.json
  record_fps: 20
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true

fps: 20
task: "Pick up the cube and place it in the box."

rename_map:
  observation.images.camera_top: observation.images.camera1
  observation.images.camera_front: observation.images.camera2
  observation.images.camera_wrist: observation.images.camera3

strategy:
  type: base

inference:
  type: rtc

play_sounds: false
display_data: false
display_mode: rerun
return_to_initial_position: false

eval:
  num_episodes: 10
  episode_time_s: 60
  reset_time_s: 3
  stats_dataset_repo_id: alexhegit/so101-simstudio-pnp
  stats_dataset_root: ./datasets/so101-simstudio-pnp
