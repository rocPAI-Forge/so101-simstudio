# SO-101 MuJoCo teleoperation with leader arm (Feetech STS3215)
# Leader arm positions → MuJoCo robot positions (1:1 mapping)

robot:
  type: so101_mujoco
  xml_path: SO101/scenes/simple_pick/scene.xml
  cube_positions_path: configs/scenes/simple_pick/cube_positions.json
  record_fps: 20                           # 20Hz：硬件可稳定达到，避免掉帧导致 sim 慢放/滞后
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true
  action_mode: position
  home_gripper: -0.1                        # 夹爪初始/复位值(rad)；接近完全闭合(下界-0.17453)但留余量，避免顶硬限位自激
  # 说明：episode 复位(reset_arm: follow / reset_cube)仅在录制时生效，见 so101_mujoco_leader.yaml；
  #       teleoperate 为连续实时控制，没有 episode 复位概念，故此处不设。
  lin_speed: 0.04
  yaw_speed: 1.20
  grip_speed: 0.7
  ori_gain: 6.0
  tilt_deadzone: 0.03
  tilt_wmax: 6.0
  lambda_pos: 0.01
  lambda_tilt: 0.0001
  vel_limit: 0.5
  vel_limit_wrist: 8.0
  smooth_dq: 0.30
  smooth_dq_wrist: 0.08
  wrist_gff_gain: 0.5
  table_z: 0.0
  clearance: 0.07
  ee_site_name: wrist_site
  tool_axis_site: [0.0, -1.0, 0.0]

teleop:
  type: so101_leader_arm
  port: /dev/ttyACM0
  use_degrees: false

fps: 20
