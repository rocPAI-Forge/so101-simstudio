# SO-101 MuJoCo teleoperation with leader arm (Feetech STS3215)
# Leader arm positions → MuJoCo robot positions (1:1 mapping)

robot:
  type: so101_mujoco
  xml_path: SO101/scenes/simple_pick/scene.xml
  cube_positions_path: configs/scenes/simple_pick/cube_positions.json
  record_fps: 20                           # 20 Hz for stable leader serial reads
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true
  action_mode: position
  home_gripper: -0.1                        # Gripper at reset (rad); near closed but off hard limit
  # Episode reset (reset_arm/reset_cube) applies only in record configs; teleop has no episode boundary.
  lin_speed: 0.04
  yaw_speed: 1.20
  grip_speed: 0.7
  ori_gain: 6.0
  tilt_deadzone: 0.03
  tilt_wmax: 6.0
  lambda_pos: 0.01
  lambda_tilt: 0.0001
  vel_limit: 0.5
  vel_limit_wrist: 8.0
  smooth_dq: 0.30
  smooth_dq_wrist: 0.08
  wrist_gff_gain: 0.5
  table_z: 0.0
  clearance: 0.07
  ee_site_name: wrist_site
  tool_axis_site: [0.0, -1.0, 0.0]

teleop:
  type: so101_leader_arm
  port: /dev/ttyACM0
  use_degrees: false

fps: 20
