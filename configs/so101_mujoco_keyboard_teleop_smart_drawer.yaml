# Keyboard teleop on the Text2MuJoCo 02 smart-drawer workcell (no recording).

robot:
  type: so101_mujoco
  action_mode: velocity
  xml_path: SO101/scenes/smart_drawer/scene.xml
  cube_positions_path: configs/scenes/smart_drawer/cube_positions.json
  record_fps: 30
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  # Recorded cams only. Scene ``overview`` is GLFW 4th pane (teleop view), not listed here.
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true
  lin_speed: 0.04
  yaw_speed: 1.20
  grip_speed: 0.7
  ori_gain: 6.0
  tilt_deadzone: 0.03
  tilt_wmax: 6.0
  lambda_pos: 0.01
  lambda_tilt: 0.0001
  vel_limit: 0.5
  vel_limit_wrist: 8.0
  smooth_dq: 0.30
  smooth_dq_wrist: 0.08
  wrist_gff_gain: 0.5
  table_z: 0.0
  clearance: 0.07
  ee_site_name: wrist_site
  tool_axis_site: [0.0, -1.0, 0.0]

teleop:
  type: so101_keyboard
