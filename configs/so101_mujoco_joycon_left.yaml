# =============================================================================
# SO-101 SimStudio - Left Joy-Con Recording Config
# =============================================================================
# Same as so101_mujoco_joycon.yaml with teleop.side: left.
# View mode: --view_mode mujoco (default) | rerun
# =============================================================================

robot:
  type: so101_mujoco
  action_mode: velocity
  horizontal_control_mode: cylindrical
  ik_joint_weights: [1.15, 0.90, 0.55]
  xml_path: SO101/scenes/simple_pick/scene.xml
  cube_positions_path: configs/scenes/simple_pick/cube_positions.json
  record_fps: 30
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true
  lin_speed: 0.04
  yaw_speed: 1.20
  grip_speed: 0.7
  ori_gain: 6.0
  tilt_deadzone: 0.03
  tilt_wmax: 6.0
  lambda_pos: 0.008
  lambda_tilt: 0.0001
  vel_limit: 0.5
  vel_limit_wrist: 8.0
  smooth_dq: 0.30
  smooth_dq_wrist: 0.08
  wrist_gff_gain: 0.5
  table_z: 0.0
  clearance: 0.07
  ee_site_name: wrist_site
  tool_axis_site: [0.0, -1.0, 0.0]

teleop:
  type: so101_joycon
  side: left
  device: auto
  translation_scale: 1.5
  z_scale: 1.0
  stick_axis_map: reach_swing
  invert_x: false
  invert_y: false
  # Left has no A/B/X/Y — wrists on d-pad (same as smart_drawer left teleop).
  wrist_control: buttons
  wrist_flex_pos_button: up
  wrist_flex_neg_button: down
  wrist_roll_pos_button: left
  wrist_roll_neg_button: right
  wrist_button_rate: 2.0
  gripper_toggle: true                     # true=toggle ZR/ZL; false=hold to close
  # Recording remapped off the d-pad (keyboard N/R/Q still works)
  enable_button_recording: true
  next_episode_button: capture             # Capture = save & next
  restart_episode_button: home             # Home = cancel & re-record
  stop_button: minus                       # Minus = stop session


dataset:
  repo_id: alexhegit/so101_mujoco_joycon_left_test
  root: ./datasets/joycon-left-test
  single_task: "SO-101 MuJoCo Joy-Con left-hand manipulation"
  fps: 30
  episode_time_s: 120
  reset_time_s: 3
  num_episodes: 1
  video: true
  push_to_hub: false
  private: false
  tags: null
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  streaming_encoding: false
  encoder_queue_maxsize: 30
  encoder_threads: null
  rgb_encoder:
    vcodec: libsvtav1
    pix_fmt: yuv420p
    g: 2
    crf: 30
    preset: 12
    fast_decode: 0
    video_backend: pyav
    extra_options: {}

display_data: false
display_mode: rerun
display_ip: null
display_port: null
display_compressed_images: false
play_sounds: false
resume: false
