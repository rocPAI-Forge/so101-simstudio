# =============================================================================
# SO-101 SimStudio - Production pick-and-place recording (leader arm)
# =============================================================================
# Best trajectory quality: 1:1 joint position mapping from real leader arm.
#
# Usage:
#   source .venv-rocm/bin/activate
#   python -m simstudio.scripts.record --config configs/so101_mujoco_pick_leader.yaml
#
# Recording quality checklist (each episode):
#   - Approach cube from above, align gripper, close on cube
#   - Lift, move over container, release cube inside box
#   - Y = cancel & re-record bad takes; N or Right = save & next; ESC/Q = stop
#   - Use --resume true to continue after interruption
# =============================================================================

robot:
  type: so101_mujoco
  action_mode: position
  home_gripper: -0.1
  reset_mode: auto
  reset_arm: follow
  reset_cube: random
  # Swapped with container: cube spawns where container was (~0.3, 0.2), same 8×7 cm rect.
  cube_random_x_range: [0.26, 0.34]
  cube_random_y_range: [0.165, 0.235]
  cube_random_z: 0.0125
  cube_random_yaw_range: [-45.0, 45.0]
  xml_path: SO101/scenes/simple_pick/scene.xml
  cube_positions_path: configs/scenes/simple_pick/cube_positions.json
  record_fps: 20
  control_fps: 180
  physics_fps: 360
  camera_width: 640
  camera_height: 480
  camera_names: [front, top, wrist]
  show_collision_geometry: false
  render_window: true
  lin_speed: 0.04
  yaw_speed: 1.20
  grip_speed: 0.7
  ori_gain: 6.0
  tilt_deadzone: 0.03
  tilt_wmax: 6.0
  lambda_pos: 0.01
  lambda_tilt: 0.0001
  vel_limit: 0.5
  vel_limit_wrist: 8.0
  smooth_dq: 0.30
  smooth_dq_wrist: 0.08
  wrist_gff_gain: 0.5
  table_z: 0.0
  clearance: 0.07
  ee_site_name: wrist_site
  tool_axis_site: [0.0, -1.0, 0.0]

teleop:
  type: so101_leader_arm
  port: /dev/ttyACM0
  use_degrees: false

dataset:
  repo_id: alexhegit/so101_pick_leader
  root: ./datasets/so101_pick_leader
  single_task: "Pick up the cube and place it in the box."
  fps: 20
  episode_time_s: 90
  reset_time_s: 5
  num_episodes: 50
  video: true
  push_to_hub: false
  private: false
  tags: [so101, mujoco, pick-place, leader]
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  streaming_encoding: false
  encoder_queue_maxsize: 30
  encoder_threads: null
  rgb_encoder:
    vcodec: libsvtav1
    pix_fmt: yuv420p
    g: 2
    crf: 28
    preset: 12
    fast_decode: 0
    video_backend: pyav
    extra_options: {}

display_data: false
display_mode: rerun
display_ip: null
display_port: null
display_compressed_images: false
play_sounds: false
resume: false
